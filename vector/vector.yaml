# Vector — ingestor del pipeline, versión Google Cloud.
#
# Portado 1:1 de la config que corre en la EC2 (AWS). Lo ÚNICO que cambia son
# los destinos: los tres sinks `aws_s3` pasan a `gcp_cloud_storage` (mismo
# `key_prefix`, mismo encoding, mismo parquet) y las métricas van a Cloud
# Monitoring en vez de CloudWatch. El source, las transformaciones, el filtro
# de bots y los taps quedan textuales.
#
# Credenciales: NINGUNA en este archivo. La VM lleva pegada la service account
# con `objectCreator` sobre el bucket y Vector toma el token del entorno.
#
# Valores a revisar si se reinstala en otro lado: `bucket` (x3) y `project_id`.

data_dir: /var/lib/vector

acknowledgements:
  enabled: true

sources:
  http_in:
    type: http_server
    # Sólo local: quien atiende desde afuera es Caddy, en el 443. Aunque el
    # firewall ya no expone el 8080, atarlo a loopback lo hace inalcanzable
    # incluso si mañana alguien abre el puerto por error.
    address: 127.0.0.1:8080
    path: /v1/batch
    decoding:
      codec: bytes
    framing:
      method: bytes

  vector_metrics:
    type: internal_metrics

transforms:
  split_events:
    type: remap
    inputs:
      - http_in
    drop_on_error: true
    drop_on_abort: true
    reroute_dropped: true
    source: |
      raw = string!(.message)
      recv_ts = timestamp!(.timestamp)
      recv_ms = to_unix_timestamp(recv_ts, unit: "milliseconds")
      payload = object!(parse_json!(raw))
      sent_ms = recv_ms
      sent_str = ""
      if payload.sentAt != null {
        sent_str = to_string!(payload.sentAt)
        sent_ms = to_unix_timestamp(parse_timestamp!(sent_str, "%+"), unit: "milliseconds")
      }
      events = array!(payload.batch)
      out = []
      for_each(events) -> |_i, e| {
        ev = object!(e)
        orig_ms = sent_ms
        orig_str = ""
        if ev.originalTimestamp != null {
          orig_str = to_string(ev.originalTimestamp) ?? ""
          parsed_orig, perr = parse_timestamp(orig_str, "%+")
          if perr == null {
            orig_ms = to_unix_timestamp(parsed_orig, unit: "milliseconds")
          }
        }
        corrected_ms = recv_ms - (sent_ms - orig_ms)
        rec = {
          "message_id": null,
          "anonymous_id": null,
          "user_id": null,
          "type": null,
          "event": null,
          "channel": null,
          "schema_version": "1",
          "group_id": null,
          "previous_id": null,
          "original_timestamp": null,
          "sent_at": null,
          "received_at": recv_ts,
          "timestamp": from_unix_timestamp!(corrected_ms, unit: "milliseconds"),
          "context": null,
          "properties": null,
          "traits": null,
          "integrations": null
        }
        if ev.messageId != null { rec.message_id = to_string(ev.messageId) ?? null }
        if ev.anonymousId != null { rec.anonymous_id = to_string(ev.anonymousId) ?? null }
        if ev.userId != null { rec.user_id = to_string(ev.userId) ?? null }
        if ev.type != null { rec.type = to_string(ev.type) ?? null }
        if ev.event != null { rec.event = to_string(ev.event) ?? null }
        if ev.channel != null { rec.channel = to_string(ev.channel) ?? null }
        if orig_str != "" { rec.original_timestamp = orig_str }
        if sent_str != "" { rec.sent_at = sent_str }
        if ev.context != null { rec.context = encode_json(ev.context) }
        if ev.properties != null { rec.properties = encode_json(ev.properties) }
        if ev.traits != null { rec.traits = encode_json(ev.traits) }
        if ev.integrations != null { rec.integrations = encode_json(ev.integrations) }
        if ev.groupId != null { rec.group_id = to_string(ev.groupId) ?? null }
        if ev.previousId != null { rec.previous_id = to_string(ev.previousId) ?? null }
        out = push(out, rec)
      }
      . = out

  only_key_metrics:
    type: filter
    inputs:
      - vector_metrics
    condition: 'includes(["component_errors_total", "buffer_size_bytes", "buffer_discarded_events_total", "component_discarded_events_total"], .name)'

  tap_ingest:
    type: remap
    inputs:
      - http_in
    source: |
      . = { "stage": "INGEST", "at": .timestamp, "bytes": length(string!(.message)) }

  tap_transform:
    type: remap
    inputs:
      - split_events
    source: |
      . = { "stage": "TRANSFORM", "at": .received_at, "message_id": .message_id, "type": .type, "event": .event }

  bronze_clean:
    type: remap
    inputs:
      - split_events
    drop_on_error: false
    drop_on_abort: true
    reroute_dropped: false
    source: |
      # ids vacios -> null. El estandar es omitir el campo o mandar null; el SDK
      # manda userId:"" para anonimos y "" obliga a nullif() en cada consulta.
      if .user_id == "" { .user_id = null }
      if .anonymous_id == "" { .anonymous_id = null }
      if .group_id == "" { .group_id = null }
      if .previous_id == "" { .previous_id = null }

      # Bots: se filtran aca, en el collector. context viaja como JSON string en
      # bronze, asi que hay que parsearlo para llegar al user agent.
      ua = ""
      ctx = .context
      if is_string(ctx) {
        parsed, perr = parse_json(string!(ctx))
        if perr == null { ctx = parsed }
      }
      if is_object(ctx) {
        ua = downcase(to_string(object!(ctx).userAgent) ?? "")
      }
      if ua != "" && match(ua, r'(bot|crawl|spider|scraper|slurp|headless|phantomjs|puppeteer|playwright|selenium|scrapy|python-requests|okhttp|java/|go-http-client|libwww|curl/|wget|lighthouse|pagespeed|gtmetrix|pingdom|uptimerobot|monitoring|facebookexternalhit|whatsapp|telegram|discord|slack|embedly|preview|ahrefs|semrush|mj12|dotbot|petal|yandex|baiduspider|bingbot|googlebot|applebot|duckduckbot|bytespider|gptbot|claudebot|ccbot|perplexity|meta-externalagent|amazonbot|imagesift)') {
        abort
      }

sinks:
  # ── raw: el POST tal cual llegó ───────────────────────────────
  gcs_raw:
    type: gcp_cloud_storage
    healthcheck:
      enabled: false
    inputs:
      - http_in
    bucket: sessions-ingest-lake
    key_prefix: "raw/v=1/dt=%F/"
    compression: zstd
    encoding:
      codec: json
    batch:
      timeout_secs: 600
      max_bytes: 67108864
    buffer:
      type: disk
      max_size: 1073741824
      when_full: block

  # ── bronze: un parquet por lote, ya spliteado y sin bots ──────
  #
  # ATENCIÓN, la única excepción del archivo: este sink es `aws_s3` apuntado a
  # la API COMPATIBLE CON S3 de GCS, no `gcp_cloud_storage`. Motivo verificado
  # en Vector 0.57: `batch_encoding` (el que produce parquet) sólo existe en el
  # sink de S3. Escribe en el MISMO bucket y con el mismo prefijo que los
  # demás; para GCS es un objeto igual a cualquier otro.
  #
  # Costo de esta excepción: es el único componente que necesita credenciales
  # —claves HMAC de la misma service account de la VM—, y viajan por el
  # entorno del servicio (/etc/vector/hmac.env, 0600 de root), nunca en este
  # archivo ni en el repo.
  #
  # Las claves son de GOOGLE, no de AWS: `gcloud storage hmac create` las
  # emite para la service account. Se nombran acá por lo que son, en vez de
  # dejar que el sink las tome de las variables AWS_* por convención.
  gcs_bronze:
    type: aws_s3
    endpoint: https://storage.googleapis.com
    region: auto
    auth:
      access_key_id: "${GCS_HMAC_ACCESS_ID}"
      secret_access_key: "${GCS_HMAC_SECRET}"
    healthcheck:
      enabled: false
    inputs:
      - bronze_clean
    bucket: sessions-ingest-lake
    key_prefix: "bronze/v=1/dt=%F/"
    compression: none
    encoding:
      codec: text
    batch_encoding:
      codec: parquet
      schema_file: /etc/vector/bronze_v1.schema
      schema_mode: relaxed
      compression:
        algorithm: zstd
        level: 6
    batch:
      timeout_secs: 600
      max_bytes: 67108864
    buffer:
      type: disk
      max_size: 2147483648
      when_full: block

  # ── errores: lo que el split no pudo parsear ─────────────────
  gcs_errors:
    type: gcp_cloud_storage
    healthcheck:
      enabled: false
    inputs:
      - split_events.dropped
    bucket: sessions-ingest-lake
    key_prefix: "errors/dt=%F/"
    compression: zstd
    encoding:
      codec: json
    batch:
      timeout_secs: 60
    buffer:
      type: disk
      max_size: 268435488
      when_full: block

  # ── métricas del propio Vector (reemplaza a CloudWatch) ──────
  monitoring:
    type: gcp_stackdriver_metrics
    inputs:
      - only_key_metrics
    project_id: sessions-ingest
    default_namespace: VectorPipeline
    resource:
      type: global

  console_taps:
    type: console
    inputs:
      - tap_ingest
      - tap_transform
    target: stdout
    encoding:
      codec: json
